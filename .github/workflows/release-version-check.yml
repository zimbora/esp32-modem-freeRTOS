on:
  push:
    tags:
      - '*'
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check library.properties version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(grep '^version=' library.properties | cut -d= -f2)
          if [ "$VERSION" != "$TAG" ]; then
            echo "ERROR: library.properties version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "OK: library.properties version ($VERSION) matches tag ($TAG)"
      - uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update
          compliance: strict
